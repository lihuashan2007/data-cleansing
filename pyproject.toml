[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "data-cleansing"
version = "0.1.0"
description = "DataFrame, calendar, text, and WRDS helpers for research data"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "lihuashan2007"}]
dependencies = ["pandas>=2.2,<4", "tzdata"]

[project.urls]
Repository = "https://github.com/lihuashan2007/data-cleansing"
Issues = "https://github.com/lihuashan2007/data-cleansing/issues"

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["DataCleansing"]

[tool.setuptools.packages.find]
where = ["src"]
